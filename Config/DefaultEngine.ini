; =====================================================================
; HaGiangGTA - performance profile for an Apple M1 Pro (UE 5.8)
; The M1 family is Metal SM5 only (UE needs Apple8 / M2+ for SM6), so:
; no Nanite (meshes use LOD chains), cascaded + distance-field shadows
; instead of Virtual Shadow Maps, software Lumen at reduced quality,
; TSR at 66 %, 2 GB texture pool.
; =====================================================================

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/L_HaGiang_CP05.L_HaGiang_CP05
GameDefaultMap=/Game/Maps/L_HaGiang_CP05.L_HaGiang_CP05
GlobalDefaultGameMode=/Script/HaGiangGTA.HGGtaGameMode

[/Script/Engine.RendererSettings]
; --- Anti-aliasing / upscaling: Temporal Super Resolution ---
r.AntiAliasingMethod=4
r.DefaultFeature.AntiAliasing=4
; --- Lumen (software ray tracing only) ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
; --- Nanite + Virtual Shadow Maps ---
r.Nanite.ProjectEnabled=False
r.Shadow.Virtual.Enable=0
; Distance-field shadows/AO caused banding on the steep canyon landscape on M1: CSM only (+Lumen GI).
r.DistanceFieldShadowing=False
r.DistanceFieldAO=False
; --- Misc ---
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkinCache.CompileShaders=True
r.RayTracing=False
r.Substrate=False
r.CustomDepth=3

[SystemSettings]
r.ScreenPercentage=60
r.TSR.ShadingRejection.Flickering=1
r.Streaming.PoolSize=2048
r.Streaming.LimitPoolSizeToVRAM=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
; --- M1 Pro budget ---
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxCSMResolution=1536
r.Shadow.DistanceScale=0.8
r.Shadow.RadiusThreshold=0.04
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=6
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTrace=0.4
r.LumenScene.Radiosity.ProbeSpacing=8
r.VolumetricCloud.ViewRaySampleMaxCount=256
r.VolumetricCloud.ReflectionRaySampleMaxCount=24
r.ViewDistanceScale=1.0
foliage.LODDistanceScale=0.8
r.StaticMeshLODDistanceScale=1.0

